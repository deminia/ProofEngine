name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio pydantic httpx

    - name: Run Pytest Suite
      run: |
        python -m pytest tests/ -v

    - name: CI Grep Check (Zero Niche Terms in engine/)
      run: |
        python -c "
        import pathlib, sys
        forbidden = ['karma', 'ghost', 'theranos', 'madoff', 'supernatural', 'underdog']
        matches = [f'{p.name}: {word}' for p in pathlib.Path('engine').rglob('*.py') for word in forbidden if word in p.read_text(encoding='utf-8').lower()]
        if matches:
            print('CI Grep Check FAILED! Forbidden niche terms found in engine/:', file=sys.stderr)
            for m in matches:
                print(f'  - {m}', file=sys.stderr)
            sys.exit(1)
        print('CI Grep Check PASSED: 0 forbidden terms found in engine/.')
        "
